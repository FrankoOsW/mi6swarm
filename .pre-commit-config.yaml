default_language_version:
  python: python3.11
exclude: >
  (?x)^(
    .*_pb2\.py |
    .*_pb2_grpc\.py
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.4.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        exclude: ^helm/
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [ --select I --fix ]
      - id: ruff-format
