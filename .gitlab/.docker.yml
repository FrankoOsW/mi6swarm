variables:
  DOCKER_TAG: '$CI_REGISTRY_IMAGE/docker:$CI_COMMIT_SHORT_SHA'
  BUILD_PLATFORM: 'linux/amd64'

.docker:
  image: registry.naspersclassifieds.com/library/docker/build-images/deploy:latest
  services:
    - name: registry.naspersclassifieds.com/library/docker/build-images/docker:dind
      alias: docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY


.docker_branch:
  extends: .docker
  script:
    - docker version
    - docker info
    - docker context create tls-environment --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name multi-arch-builder --driver docker-container tls-environment
    - docker buildx inspect --bootstrap
    - >
      docker buildx build --platform $BUILD_PLATFORM -t $DOCKER_TAG -f ./Dockerfile --provenance=false
      --build-arg GITLAB_USERNAME=gitlab-ci-token
      --build-arg GITLAB_TOKEN=$CI_JOB_TOKEN
      --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN
      --pull --push .
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

.docker-ecr:
  extends: .docker
  script:
    - docker version
    - docker info
    - docker context create tls-environment --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name multi-arch-builder --driver docker-container tls-environment
    - docker buildx inspect --bootstrap
    - >
      docker buildx build --platform $BUILD_PLATFORM -t $DOCKER_TAG -f ./Dockerfile --provenance=false
      --build-arg GITLAB_USERNAME=gitlab-ci-token
      --build-arg GITLAB_TOKEN=$CI_JOB_TOKEN
      --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN
      --pull --push .
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
   
build:container-image-master-docker:
  stage: build
  allow_failure: true
  extends:
    - .run_on_master
    - .docker
  script:
    - docker version
    - docker info
    - docker context create tls-environment --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker buildx create --use --name multi-arch-builder --driver docker-container tls-environment
    - docker buildx inspect --bootstrap
    - >
      docker buildx build --platform $BUILD_PLATFORM -t $DOCKER_TAG -t $CI_REGISTRY_IMAGE:latest -f ./Dockerfile --provenance=false
      --build-arg GITLAB_USERNAME=gitlab-ci-token
      --build-arg GITLAB_TOKEN=$CI_JOB_TOKEN
      --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN
      --pull --push .
